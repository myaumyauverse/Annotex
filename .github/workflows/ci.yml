name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Validates frontend/Dockerfile actually builds — the deploy job is otherwise
      # the first place this Dockerfile ever gets built, live on the EC2 host.
      - run: docker build -t annotex-frontend:ci --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:5000/api/v1 .

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: annotex
          POSTGRES_PASSWORD: annotex
          POSTGRES_DB: annotex_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U annotex -d annotex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://annotex:annotex@localhost:5432/annotex_test?schema=public
      DIRECT_URL: postgresql://annotex:annotex@localhost:5432/annotex_test?schema=public
      JWT_SECRET: test-access-secret-not-for-production
      JWT_REFRESH_SECRET: test-refresh-secret-not-for-production
      CORS_ORIGIN: http://localhost:3000
      PROJECT_TREASURY_WALLET: "11111111111111111111111111111111"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:deploy
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --runInBand
      # Validates backend/Dockerfile actually builds — the deploy job is otherwise
      # the first place this Dockerfile ever gets built, live on the EC2 host.
      - run: docker build -t annotex-backend:ci .

  deploy:
    name: Deploy to EC2
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: SSH deploy + health check (auto-rollback on failure)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # First-time/cold EC2 Docker builds can exceed 40 minutes.
          command_timeout: 90m
          script: |
            set -euo pipefail
            cd ~/Annotex
            PREV_SHA=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            sudo docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build

            for i in $(seq 1 30); do
              if curl -fsS http://localhost:5000/health >/dev/null; then
                echo "Deploy healthy at $(git rev-parse HEAD)."
                exit 0
              fi
              sleep 5
            done

            echo "Health check failed after deploy — rolling back to $PREV_SHA"
            git reset --hard "$PREV_SHA"
            sudo docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
            exit 1
