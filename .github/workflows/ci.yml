name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # Required for the OIDC token exchange. Without it the AWS credentials step
  # fails with a missing-token error rather than a permissions one.
  id-token: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # On main the build-push job builds this image for real, so only validate
      # the Dockerfile on pull requests.
      - if: github.event_name == 'pull_request'
        run: docker build -t annotex-frontend:ci --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:5000/api/v1 .

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: annotex
          POSTGRES_PASSWORD: annotex
          POSTGRES_DB: annotex_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U annotex -d annotex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://annotex:annotex@localhost:5432/annotex_test?schema=public
      DIRECT_URL: postgresql://annotex:annotex@localhost:5432/annotex_test?schema=public
      JWT_SECRET: test-access-secret-not-for-production
      JWT_REFRESH_SECRET: test-refresh-secret-not-for-production
      CORS_ORIGIN: http://localhost:3000
      PROJECT_TREASURY_WALLET: "11111111111111111111111111111111"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:deploy
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --runInBand
      - if: github.event_name == 'pull_request'
        run: docker build -t annotex-backend:ci .

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"
      - name: Format check
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate bootstrap
        working-directory: infra/terraform/bootstrap
        run: terraform init -backend=false && terraform validate
      - name: Validate prod
        working-directory: infra/terraform/envs/prod
        run: terraform init -backend=false && terraform validate

  # Images are built here, not on the instance. The old SSH deploy ran
  # `docker compose up -d --build` on the production host, which is why it
  # needed COMPOSE_PARALLEL_LIMIT=1 and a 40-minute timeout: a 1-2 GiB box
  # cannot build Next 16 and the backend at the same time without OOMing, and
  # the live site degraded while it tried.
  build-push:
    needs: [frontend, backend, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/annotex/backend:${{ steps.meta.outputs.tag }}
          # GitHub's cache, 10 GB free. Using type=registry would store cache
          # layers in ECR, where they bill as image storage.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/annotex/frontend:${{ steps.meta.outputs.tag }}
          # NEXT_PUBLIC_API_BASE_URL is inlined into the browser bundle here, so
          # the image is environment-specific. Getting it wrong fails silently:
          # the site loads and every XHR goes to localhost:5000.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.PUBLIC_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy via SSM
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The annotex-deploy document pulls the tag, migrates, restarts and rolls
      # back to .last-good if /health does not come up. This role can run that
      # one document against that one instance and nothing else.
      - name: Run deploy document
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
        run: |
          set -euo pipefail

          CMD_ID=$(aws ssm send-command \
            --document-name annotex-deploy \
            --instance-ids "$INSTANCE_ID" \
            --parameters "imageTag=$IMAGE_TAG" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          # `wait` exits non-zero when the command fails, but we want the output
          # either way, so defer the failure to the status check below.
          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text >&2

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ]
