services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-annotex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-annotex}
      POSTGRES_DB: ${POSTGRES_DB:-annotex_db}
    volumes:
      - annotex-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-annotex} -d ${POSTGRES_DB:-annotex_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      # Loopback only: Nginx proxies from the host, nothing should reach these
      # directly from the internet even if a security group is widened.
      - "127.0.0.1:5433:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      API_VERSION: ${API_VERSION:-v1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-annotex}:${POSTGRES_PASSWORD:-annotex}@db:5432/${POSTGRES_DB:-annotex_db}?schema=public
      # prisma.config.ts resolves the migration datasource from DIRECT_URL, not
      # DATABASE_URL. Without this, `prisma migrate deploy` uses the placeholder
      # baked into backend/Dockerfile and the container crash-loops on startup.
      DIRECT_URL: postgresql://${POSTGRES_USER:-annotex}:${POSTGRES_PASSWORD:-annotex}@db:5432/${POSTGRES_DB:-annotex_db}?schema=public
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-annotex}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-annotex}
      DB_NAME: ${POSTGRES_DB:-annotex_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN}
      BLOCKCHAIN_NETWORK: ${BLOCKCHAIN_NETWORK:-devnet}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      PROJECT_TREASURY_WALLET: ${PROJECT_TREASURY_WALLET}
      PAYOUT_TOKEN_MINT: ${PAYOUT_TOKEN_MINT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE_PATH: logs/
      ALLOW_DEGRADED_STARTUP: "false"
    command: sh -c "npm run prisma:deploy && npm start"
    volumes:
      # Uploaded datasets and extracted images are served from here by app.ts.
      # Without a volume they are destroyed on every `up --build`.
      - annotex-uploads:/app/uploads
    ports:
      - "127.0.0.1:5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5000/api/v1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5000/api/v1}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  annotex-postgres-data:
  annotex-uploads:
